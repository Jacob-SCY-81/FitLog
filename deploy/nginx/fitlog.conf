# ============================================================
# Nginx Configuration for FitLog (Bare-metal + Cloudflare Tunnel)
# ============================================================
# Place at: /etc/nginx/sites-available/fitlog
# Enable:   sudo ln -s /etc/nginx/sites-available/fitlog /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx

upstream fitlog_backend {
    # 宿主机上 3000 端口若被 Docker/其他容器占用，FitLog 独立运行于 3001
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    # 填入您的服务器局域网 IP / TailScale 名称 / Cloudflare Tunnel 公网域名
    # 例如: server_name fitlog.yourdomain.com;
    server_name fitlog.yourdomain.com;

    # 客户端上传尺寸限制 (支持动作多媒体上传)
    client_max_body_size 20M;

    # === 安全响应头 ===
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # === Gzip 压缩支持 ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ==================== 前端静态资源 (Vite SPA 构建产物) ====================
    root /opt/fitlog/client/dist;
    index index.html;

    # 1. 前端 SPA 路由回退 — 确保路由刷新不出现 404
    location / {
        try_files $uri $uri/ /index.html;
        # HTML 入口禁止浏览器强缓存，保证版本更新后即时生效
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 2. PWA Service Worker 必须绝对禁止强缓存，确保版本即时激活
    location ~* (?:sw\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 3. 前端不可变静态资源长效缓存 (JS / CSS / 字体)
    location ~* \.(?:css|js|woff2?|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ==================== 后端 API 反向代理 ====================
    location /api/ {
        proxy_pass http://fitlog_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ==================== 媒体资源直接静态托管与长效缓存 ====================
    location /media/exercises-dataset/ {
        alias /opt/fitlog/repo/data/exercises-media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
    }

    location /media/exercises/ {
        alias /opt/fitlog/repo/data/free-exercise-db/exercises/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
    }

    # ==================== 系统健康探针直通 ====================
    location /health {
        proxy_pass http://fitlog_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }
}
