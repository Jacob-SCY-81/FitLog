# ==========================================
# FitLog Nginx 生产反向代理与安全配置 (HTTP -> HTTPS)
# ==========================================

upstream fitlog_api {
    server server:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP 80 流量处理：健康探针直通 + 其余强制 301 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 允许健康探针通过 HTTP 进行轻量探测 (便于本地监控与负载均衡心跳)
    location /health {
        proxy_pass http://fitlog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 其余业务访问统一强制 301 跳转至 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 443 业务安全主服务
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL 证书与私钥挂载路径 (只读挂载自 deploy/certs)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # SSL 现代安全协议与高强度加密套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # 客户端上传限制 (针对动作媒体上传等)
    client_max_body_size 20M;

    # Gzip 压缩支持
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 安全响应头 (含 HSTS)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端静态资源目录 (来自 client 构建产物)
    root /usr/share/nginx/html;
    index index.html;

    # 1. 前端 SPA 路由回退支持
    location / {
        try_files $uri $uri/ /index.html;
        # HTML 入口文件禁止长效强缓存，保证热更新生效
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 2. 前端不可变静态资源 (JS / CSS / SVG / 字体)
    location ~* \.(?:css|js|woff2?|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. 后端 API 反向代理
    location /api/ {
        proxy_pass http://fitlog_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $http_x_request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 4. 媒体资源静态托管与反向代理
    location /media/ {
        proxy_pass http://fitlog_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 动作库媒体文件设置 30 天缓存
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 5. 系统健康探针直通 (监控/负载均衡探针)
    location /health {
        proxy_pass http://fitlog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
