# ==========================================
# FitLog Nginx 生产反向代理与安全配置
# ==========================================

upstream fitlog_api {
    server server:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 客户端上传限制 (针对动作媒体上传等)
    client_max_body_size 20M;

    # Gzip 压缩支持
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端静态资源目录 (来自 client 构建产物)
    root /usr/share/nginx/html;
    index index.html;

    # 1. 前端 SPA 路由回退支持
    location / {
        try_files $uri $uri/ /index.html;
        # HTML 入口文件禁止长效强缓存，保证热更新生效
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 2. 前端不可变静态静态资源 (JS / CSS / SVG)
    location ~* \.(?:css|js|woff2?|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. 后端 API 反向代理
    location /api/ {
        proxy_pass http://fitlog_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 4. 媒体资源静态托管与反向代理
    location /media/ {
        proxy_pass http://fitlog_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 动作库媒体文件设置 30 天缓存
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 5. 系统健康探针直通 (监控/负载均衡探针)
    location /health {
        proxy_pass http://fitlog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
